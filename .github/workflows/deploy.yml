# deploy.yml
# Deploys after CI passes on a push to staging or main (production).
# Disabled until the repository variable DEPLOY_ENABLED is set to "true".
# See docs/ci-cd.md for the secrets and variables this needs.
# VITE_* build variables come from the Vercel project's environment settings
# (pulled by `vercel pull`), so set them per environment in Vercel.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ (github.event.workflow_run.head_branch == 'main' || inputs.environment == 'production') && 'production' || 'staging' }}
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each GitHub Environment holds its own secrets. Add a required reviewer to
    # "production" so main deploys wait for manual approval (SPMP 3.2).
    environment: ${{ (github.event.workflow_run.head_branch == 'main' || inputs.environment == 'production') && 'production' || 'staging' }}
    env:
      IS_PROD: ${{ github.event.workflow_run.head_branch == 'main' || inputs.environment == 'production' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check required secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name in this environment"; exit 1; fi
          done

      - run: npm install --global vercel@64
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ env.IS_PROD == 'true' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.IS_PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      # Optional stable URL for the staging environment, e.g. laag-ta-bai-staging.vercel.app
      - name: Alias staging deployment
        if: env.IS_PROD != 'true' && vars.VERCEL_STAGING_ALIAS != ''
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.VERCEL_STAGING_ALIAS }}" --token="$VERCEL_TOKEN"
      # Preview deployments may sit behind Vercel Authentication, so only a
      # production failure fails the job.
      - name: Smoke test
        continue-on-error: ${{ env.IS_PROD != 'true' }}
        run: curl --fail --silent --show-error --retry 3 --output /dev/null "${{ steps.deploy.outputs.url }}"
